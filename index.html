<!doctype html>
<html lang="en" class="scroll-smooth">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="NeoAssets is a community-driven catalog of system art packs and game metadata for emulation frontends. Create, share and review art packs; browse and contribute game metadata and media."
		/>
		<meta name="robots" content="index, follow" />
		<meta name="theme-color" content="#0b1016" />
		<title>NeoAssets - System Art Packs & Game Metadata</title>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
		<link rel="icon" type="image/png" href="/favicon.png?v=2" />

		<!-- The canonical URL and og:url are set per page by usePageMeta. -->
		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="NeoAssets" />
		<meta property="og:title" content="NeoAssets - System Art Packs & Game Metadata" />
		<meta
			property="og:description"
			content="Community-driven catalog of system art packs and game metadata for emulation frontends. Create, share and review; browse and contribute."
		/>
		<meta property="og:image" content="https://neoassets.dev/og-image.png?v=2" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:locale" content="en_US" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="NeoAssets - System Art Packs & Game Metadata" />
		<meta
			name="twitter:description"
			content="Community-driven catalog of system art packs and game metadata for emulation frontends."
		/>
		<meta name="twitter:image" content="https://neoassets.dev/og-image.png?v=2" />

		<!-- Structured data -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebSite",
				"name": "NeoAssets",
				"url": "https://neoassets.dev",
				"description": "Community-driven catalog of system art packs and game metadata for emulation frontends."
			}
		</script>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="preconnect" href="https://api.neoassets.dev" />
		<link rel="preconnect" href="https://cdn.neoassets.dev" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Anta&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Oxanium:wght@500;600;700&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
