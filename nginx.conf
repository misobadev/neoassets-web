server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	index index.html;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;

	# Security headers for the SPA.
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "no-referrer" always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self' http://localhost:8090 https://neoassets.dev https://api.neoassets.dev https://cdn.neoassets.dev https://*.r2.cloudflarestorage.com" always;

	# SPA fallback for react-router
	location / {
		try_files $uri $uri/ /index.html;
	}

	location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|webp|ico)$ {
		try_files $uri =404;
		expires 1y;
		add_header Cache-Control "public, immutable";
		access_log off;
	}
}