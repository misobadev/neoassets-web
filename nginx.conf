server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	index index.html;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;

	# Security headers for the SPA.
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "no-referrer" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://neoassets.dev https://api.neoassets.dev https://cdn.neoassets.dev https://*.r2.cloudflarestorage.com" always;

	# SPA fallback for react-router
	location / {
		try_files $uri $uri/ /index.html;
	}

	# index.html must always be revalidated so a deploy is picked up at once.
	location = /index.html {
		add_header Cache-Control "no-cache" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "no-referrer" always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
		add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://neoassets.dev https://api.neoassets.dev https://cdn.neoassets.dev https://*.r2.cloudflarestorage.com" always;
	}

	# Vite build output: file names carry a content hash, so they can be cached
	# forever.
	location ^~ /assets/ {
		try_files $uri =404;
		expires 1y;
		add_header Cache-Control "public, immutable";
		access_log off;
	}

	# Files from public/ (favicon, isotype, brand kit, social image) keep their
	# names across deploys: cache them briefly and revalidate, so a new version
	# shows up without renaming the file.
	location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|webp|ico)$ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=3600, must-revalidate";
		access_log off;
	}
}